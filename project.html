<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CorerepubliX - 프로젝트</title>
    
    <link rel="icon" href="https://i.postimg.cc/MKBHwqWk/logogogo.png" type="image/png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Rounded" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <link rel="stylesheet" href="project.css">
    <style>
        /* 추가된 CSS 변수 및 스타일은 project.css에 통합되므로 여기서는 최소화 */
        /* project.css 파일이 로드된다고 가정하고, HTML에 필요한 스타일만 추가 */
        .mobile-only {
            visibility: hidden; /* 기본값은 숨김 */
        }
        @media (max-width: 768px) {
            .mobile-only {
                visibility: visible; 
            }
        }
    </style>
</head>
<body>
  <div class="phone" role="application" aria-label="Recore AI UI">
    
    <header class="header" id="mainHeader">
        
        <div class="header-left-group">
            <div class="header-title">
                <a href="index.html">CorerepubliX</a>
            </div>
            
            <div class="header-center pc-menu-links">
                <a href="project" class="action-btn">프로젝트</a>
                <a href="team" class="action-btn">팀 코어리퍼블릭스</a>
                <a href="terms" class="action-btn">약관</a>
                <a href="docs" class="action-btn">문서</a>
            </div>
        </div>
        
        <div class="header-icon menu-icon mobile-only" aria-label="메뉴"> 
            <span class="material-symbols-rounded">menu</span>
        </div>
        
    </header>

    <div class="mobile-menu-dropdown" id="mobileDropdown">
        <a href="project">프로젝트</a>
        <a href="team">팀 코어리퍼블릭스</a>
        <a href="terms">약관</a>
        <a href="docs">문서</a>
    </div>

    <main>
        <div class="project-page-title">
            Project
        </div>
        
        <div class="project-grid">
            
            <div class="project-card">
                <h2 class="card-title">MinsuGPT</h2>
                
                <div class="status-container">
                    <span class="status-text developing">개발중</span>
                    <span class="material-symbols-rounded status-icon developing">check_circle</span>
                </div>

                <p class="card-description">
                    CorerepubliX에서 첫번째로 개발중인 AI입니다. 아래 버튼을 클릭하여 사용해보세요.
                </p>

                <a href="https://minsugpt.kro.kr/chat" class="use-button">MinsuGPT 사용하기</a>
            </div>
            
            <div class="project-card">
                <h2 class="card-title">Unknown</h2>
                
                <div class="status-container">
                    <span class="status-text discussing">논의중</span>
                    <span class="material-symbols-rounded status-icon discussing">check_circle</span>
                </div>

                <p class="card-description">
                    아직 개발이 진행중이지 않은 논의단계입니다. 개발이 완료되면 알려드릴게요!
                </p>

                <a href="#" onclick="return false;" class="use-button disabled-button">아직은 사용할 수 없습니다</a>
            </div>
            
            </div>
        
    </main>
    
  </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuIcon = document.querySelector('.menu-icon');
            const mobileDropdown = document.getElementById('mobileDropdown');
            const pcBreakpoint = 769; 

            // --- 모바일 메뉴 드롭다운 토글 기능 ---
            if (menuIcon && mobileDropdown) {
                menuIcon.addEventListener('click', (e) => {
                    e.stopPropagation(); 
                    mobileDropdown.classList.toggle('is-open');
                });
            }
            
            // --- 외부 클릭 시 드롭다운 닫기 기능 ---
            document.addEventListener('click', (e) => {
                if (window.innerWidth < pcBreakpoint) { 
                    if (mobileDropdown.classList.contains('is-open') && !mobileDropdown.contains(e.target) && !menuIcon.contains(e.target)) {
                        mobileDropdown.classList.remove('is-open');
                    }
                }
            });
            
            // --- 화면 크기 변경 감지 (PC/모바일 전환 시 드롭다운 닫기) ---
            const closeDropdownOnResize = () => {
                if (window.innerWidth >= pcBreakpoint && mobileDropdown.classList.contains('is-open')) {
                    mobileDropdown.classList.remove('is-open');
                }
            };

            window.addEventListener('resize', closeDropdownOnResize);
        });
    </script>
</body>
</html>
